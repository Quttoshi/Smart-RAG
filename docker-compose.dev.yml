services:
  redis:
    image: redis:7.4-alpine
    container_name: smart-rag-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

  backend:
    build:
      context: ./backend
    container_name: smart-rag-backend-dev
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      VECTOR_STORE_PATH: /app/vector_store
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - vector_store_dev:/app/vector_store
    depends_on:
      - redis

volumes:
  redis_dev_data:
  vector_store_dev:
